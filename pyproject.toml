[project]
name = "rag-document-application"
version = "1.0.0"
description = "Document intelligence with hybrid retrieval, reranking and page-level citations"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
