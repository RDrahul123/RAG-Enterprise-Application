[project]
name = "rag-enterprise"
version = "1.0.0"
description = "Document intelligence platform with hybrid retrieval, reranking and page-level citations"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
