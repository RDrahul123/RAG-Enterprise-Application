name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-msmarco

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Run tests
        env:
          RAG_USE_LLM: "0"
        run: pytest tests -v

      - name: Smoke-test ingestion and the API
        env:
          RAG_USE_LLM: "0"
        run: |
          python ingest.py
          python -c "
          from fastapi.testclient import TestClient
          from app import app
          client = TestClient(app)
          assert client.get('/api/health').json()['indexed'] is True
          body = client.post('/api/ask', json={'question': 'How many days of annual leave?'}).json()
          assert body['citations'], 'expected at least one citation'
          print('smoke ok:', body['citations'][0]['doc'], 'page', body['citations'][0]['page'])
          "
