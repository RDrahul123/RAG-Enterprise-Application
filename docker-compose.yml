services:
  rag:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-auto}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # Mount your own corpus here to swap documents without rebuilding.
      - ./data/docs:/app/data/docs
      - ./data/index:/app/data/index
      - hf-cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:
